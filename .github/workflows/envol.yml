name: Envol candidate
run-name: Candidate ${{ inputs.candidate_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        required: true
        type: string
      envol_url:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci && npm run check && npm test && npm run build
      - run: cargo test --locked && cargo build --release --locked
      - run: cargo package --locked -p envol
      - name: Test the release binary and prepare artifact
        run: |
          target/release/envol --version
          target/release/envol check
          mkdir -p dist-release
          tar -czf dist-release/envol-linux-x64.tar.gz -C target/release envol
          packages=(target/package/envol-*.crate)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" dist-release/
      - name: Retain artifact and report validation
        env:
          ENVOL_URL: ${{ inputs.envol_url }}
          ENVOL_CANDIDATE: ${{ inputs.candidate_id }}
        run: node scripts/upload-candidate.mjs
