name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Prepare storage, apply migrations, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/bootstrap-cloudflare.mjs
          npx wrangler d1 migrations apply envol --remote --config wrangler.ci.json
          node scripts/seed-hosted.mjs
          npx wrangler deploy --config wrangler.ci.json
      - name: Check deployed service
        if: vars.ENVOL_DOMAIN_READY == 'true'
        run: curl --fail --retry 5 --retry-delay 5 https://envol.jdx.dev/health
